<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Carta Digital | Club Montebello</title>
    <meta name="description" content="Carta digital de Club Montebello, Villa Carlos Paz. Entradas, platos de autor, carnes a la leña, pastas caseras, postres y más.">
    <meta name="theme-color" content="#040404">
    <link rel="icon" type="image/png" href="imagenes/official-logo.png">

    <!-- Google Fonts (misma tipografía que la página de reservas) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="carta.css?v=2.7">
</head>
<body>

    <!-- Fondo fotográfico (igual a reservas) -->
    <div class="bg-wrapper" aria-hidden="true">
        <img src="imagenes/fondo-vino.jpg" alt="" class="bg-image">
        <div class="bg-overlay"></div>
    </div>

    <div class="page">

        <!-- Barra superior -->
        <nav class="top-bar" aria-label="Accesos rápidos">
            <a href="/" class="pill-link" id="linkReservar">Reservar mesa</a>
            <div class="social-group">
                <a href="https://wa.me/5493541760808" target="_blank" rel="noopener" class="social-btn" id="linkWhatsapp" aria-label="WhatsApp">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                </a>
                <a href="https://www.instagram.com/clubmontebello/" target="_blank" rel="noopener" class="social-btn" id="linkInstagram" aria-label="Instagram">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                </a>
                <a href="https://maps.app.goo.gl/N98GZTW9BFzf8oLK7" target="_blank" rel="noopener" class="social-btn" id="linkMaps" aria-label="Ubicación en Google Maps">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                </a>
            </div>
        </nav>

        <!-- Marca -->
        <header class="brand">
            <a href="#/" class="brand-link" id="linkInicioCarta" aria-label="Inicio de la carta">
                <img src="imagenes/official-logo.png" alt="Logo Club Montebello" class="brand-logo" width="44" height="44">
                <p class="brand-name">Club Montebello</p>
            </a>
            <h1 class="brand-sub">Carta Digital</h1>
        </header>

        <!-- Migas de pan -->
        <nav class="crumbs" id="crumbs" aria-label="Ubicación en la carta"></nav>

        <!-- Contenido dinámico -->
        <main id="view" class="view" aria-live="polite"></main>

        <footer class="foot">
            <a href="/" class="btn-primary" id="btnReservarFooter">Reservar una mesa</a>
            <p class="foot-note">Club Montebello · Villa Carlos Paz</p>
            <p class="foot-note small" id="lastUpdate"></p>
        </footer>
    </div>

    <script src="carta.js?v=2.7"></script>
</body>
</html>
